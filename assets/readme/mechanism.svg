<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="mech-title mech-desc">
  <title id="mech-title">How the two features work</title>
  <desc id="mech-desc">Quick launch: toolbar button opens a fuzzy selector of configured tools, which opens a new terminal tab via the login shell. AI panel: a second toolbar button attaches a chat panel to the active terminal tab, which runs claude -p --output-format stream-json with the tab's cwd and scrollback as context.</desc>

  <rect width="1200" height="480" rx="22" fill="#141310"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="21.5" fill="none" stroke="#2c2820" stroke-width="1"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9a45c"/>
    </marker>
  </defs>

  <!-- Lane 1: Quick launch -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="52" font-size="15" font-weight="600" letter-spacing="2" fill="#8a8272">QUICK LAUNCH</text>
    <text x="48" y="74" font-size="13" fill="#615c4d">independent tab, no context sent</text>
  </g>

  <g transform="translate(48 100)">
    <rect width="220" height="96" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <text x="20" y="38" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">"AI CLI" button</text>
    <text x="20" y="64" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">toolbar, weight 0</text>
  </g>
  <path d="M270 148 H 336" stroke="#d9a45c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(338 92)">
    <rect width="290" height="112" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">Fuzzy selector</text>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="13" fill="#a49c88">claude · codex</text>
    <text x="20" y="80" font-family="ui-monospace, monospace" font-size="13" fill="#a49c88">agent · pi</text>
  </g>
  <path d="M630 148 H 696" stroke="#d9a45c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(698 92)">
    <rect width="300" height="112" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">New terminal tab</text>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="12.5" fill="#a49c88">$SHELL --login -i -c</text>
    <text x="20" y="80" font-family="ui-monospace, monospace" font-size="12.5" fill="#a49c88">"exec claude …"</text>
  </g>

  <line x1="48" y1="228" x2="1152" y2="228" stroke="#2c2820" stroke-width="1"/>

  <!-- Lane 2: AI panel -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="270" font-size="15" font-weight="600" letter-spacing="2" fill="#8a8272">AI PANEL</text>
    <text x="48" y="292" font-size="13" fill="#615c4d">bound to the current tab's session</text>
  </g>

  <g transform="translate(48 318)">
    <rect width="220" height="112" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">Panel button</text>
    <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">or an assignable</text>
    <text x="20" y="80" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">hotkey</text>
  </g>
  <path d="M270 374 H 336" stroke="#d9a45c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(338 310)">
    <rect width="270" height="128" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">Terminal decorator</text>
    <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">mounts panel into</text>
    <text x="20" y="80" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">the active tab's</text>
    <text x="20" y="100" font-family="-apple-system, sans-serif" font-size="13" fill="#a49c88">own DOM element</text>
  </g>
  <path d="M610 374 H 676" stroke="#d9a45c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(678 302)">
    <rect width="290" height="144" rx="10" fill="#211a0f" stroke="#4a3f28" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#f1ede4">claude -p</text>
    <text x="20" y="54" font-family="ui-monospace, monospace" font-size="12" fill="#d9a45c">--output-format</text>
    <text x="20" y="72" font-family="ui-monospace, monospace" font-size="12" fill="#d9a45c">stream-json</text>
    <line x1="20" y1="86" x2="270" y2="86" stroke="#4a3f28" stroke-width="1"/>
    <text x="20" y="108" font-family="-apple-system, sans-serif" font-size="12" fill="#a49c88">+ tab's cwd</text>
    <text x="20" y="126" font-family="-apple-system, sans-serif" font-size="12" fill="#a49c88">+ recent scrollback</text>
  </g>
  <path d="M970 374 H 1036" stroke="#d9a45c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1038 318)">
    <rect width="114" height="112" rx="10" fill="#1c1913" stroke="#3a3527" stroke-width="1"/>
    <circle cx="30" cy="34" r="4" fill="#615c4d"/>
    <text x="42" y="38" font-family="-apple-system, sans-serif" font-size="12" fill="#a49c88">reply</text>
    <rect x="18" y="52" width="78" height="20" rx="6" fill="#241f16"/>
    <rect x="18" y="78" width="60" height="20" rx="6" fill="#241f16"/>
  </g>
</svg>
